name: Validate AI Skills
on: [ push, pull_request ]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Check Python Compilation
        run: |
          python3 -m py_compile install.py
          python3 -m py_compile new-skill.py
          python3 -m py_compile gen-checksums.py

      - name: Verify Checksums
        run: python3 gen-checksums.py --check

      - name: Validate Skill Schemas
        run: |
          # Simple check: ensure skill.json exists for every skill except _template
          find skills -maxdepth 1 -mindepth 1 -type d ! -name "_template" -exec sh -c 'ls "{}/skill.json" || exit 1' \;
